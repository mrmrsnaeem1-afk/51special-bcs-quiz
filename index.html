<script>
/* ═══════════════════════════════════════════════════════════
   ORAL PATHOLOGY QUESTION BANK — 30 Questions
   Source key: ক=a, খ=b, গ=c, ঘ=d
   ═══════════════════════════════════════════════════════════ */
const questions = [

  {

  },
  {

  },
  {
    text: "Which radiographic feature is classic for Dentinogenesis Imperfecta?",
    options: ["Excessively long, thick roots", "Sun-ray appearance of the jaw bone", "Teeth floating in the air", "Obliterated pulp chambers and stunted roots"],
    correct: 3,
    explanation: "Obliterated pulp chambers and stunted roots are classical radiological findings in dentinogenesis imperfecta."
  },
  {
    text: "What condition is notoriously known as the cause of 'rootless teeth'?",
    options: ["Amelogenesis imperfecta", "Dentinal dysplasia", "Regional odontodysplasia", "Fluorosis"],
    correct: 1,
    explanation: "Dentinal dysplasia may cause no root formation — 'rootless teeth'."
  },
  {
    text: "The most common tooth for Dens invaginatus to occur is the:",

    options: ["20 minutes", "1 to 2 hours", "12 to 24 hours", "3 days"],

  {
    text: "Which of the following sugars is considered the least cariogenic?",
    options: ["Xylitol", "Sorbitol", "Sucrose", "Lactose"],

    explanation: "Sucrose is the most cariogenic. As per the provided answer key, lactose is marked as the least cariogenic among the listed options."
  },
  {
    text: "Chronic hyperplastic pulpitis (pulp polyp) is clinically characterized as:",
    options: ["A highly painful, pale ulcer", "A painless, dusky red or pinkish soft nodule protruding into a cavity", "A hard, bony outgrowth from the root surface", "A dark brown patch on the gingiva"],
    correct: 1,
    explanation: "Pulp polyp presents as a painless, dusky red or pinkish soft nodule protruding into a cavity due to chronic irritation."
  },
  {
    text: "What term describes a type of hypercementosis that causes the fusion of roots of adjacent teeth?",
    options: ["Gemination", "Concrescence", "Dilaceration", "Taurodontism"],
    correct: 1,
    explanation: "Concrescence is the fusion of adjacent teeth by cementum."
  },
  {
    text: "Which of the following bacteria associated with chronic periodontitis is classified as a facultative anaerobe?",
    options: ["Porphyromonas gingivalis", "Fusobacterium nucleatum", "Tannerella forsythia", "Eikenella corrodens"],

    text: "Glossitis associated with Vitamin B12 deficiency is traditionally described as:",

  },
  {
    text: "Patients with Sjögren's syndrome have a significantly increased risk of developing which malignancy?",
    options: ["Mucoepidermoid carcinoma", "Adenoid cystic carcinoma", "Squamous cell carcinoma", "Lymphoma"],
    correct: 3,

  },
  {
    text: "Primary Sjögren's syndrome comprises:",
    options: ["Dry mouth and dry eyes associated with Rheumatoid Arthritis", "Dry mouth and dry eyes not associated with connective tissue disease", "Excess salivation and tearing due to heavy smoking", "Painful enlargement of the parotid gland due to viral infection"],
    correct: 1,

  {

    options: ["Magnetic Resonance Imaging (MRI)", "Sialography", "Cone beam CT", "Orthopantomogram (OPG)"],

    correct: 2,

  },
  {
    text: "Which salivary gland malignancy is notorious for early pain due to its strong tendency for perineural invasion?",
    options: ["Pleomorphic adenoma", "Warthin's tumor", "Low-grade mucoepidermoid carcinoma", "Adenoid cystic carcinoma"],
    correct: 3,
    explanation: "Adenoid cystic carcinoma is associated with perineural invasion and early pain."

  },
  {

    correct: 3,

  {

    options: ["Clindamycin", "Lincomycin", "Fidaxomicin", "Vancomycin"],
    correct: 2,
    explanation: "Fidaxomicin is a newer alternative to metronidazole and reduces relapses."
  },
  {
    text: "An asymptomatic root tip displaced into the antrum with zero mucosal reaction should be managed by:",
    options: ["Avoiding immediate digging; monitoring infection risks", "Urgent Caldwell-Luc emergency surgery", "Immediate socket digging and exploration", "Immediate deep mental nerve block anesthesia"],
    correct: 0,
    explanation: "Immediate digging can cause trauma to the antral lining; avoid immediate digging and monitor."
  },
  {
    text: "Which cell contributes to forming cholesterol crystals within the lumen of a radicular cyst?",
    options: ["Epithelial cell of Malassez", "Rest of Serres", "Erythrocyte", "Macrophage"],

  }
];

/* ═══════════════════════════════════════════════════════════
   CONSTANTS & STATE
   ═══════════════════════════════════════════════════════════ */
const TOTAL = questions.length;
const NEGATIVE_MARK = 0.5;
const QUIZ_DURATION = 25 * 60;

let examineeName = '';
let answers = new Array(TOTAL).fill(null);
let timer = QUIZ_DURATION;
let timerInterval = null;
let isSubmitted = false;

/* DOM */
const startScreen = document.getElementById('startScreen');
const quizScreen = document.getElementById('quizScreen');
const resultScreen = document.getElementById('resultScreen');
const nameInput = document.getElementById('nameInput');
const startBtn = document.getElementById('startBtn');
const timerBox = document.getElementById('timerBox');
const timerDisplay = document.getElementById('timerDisplay');
const quizName = document.getElementById('quizName');
const progressText = document.getElementById('progressText');
const answeredCount = document.getElementById('answeredCount');
const progressFill = document.getElementById('progressFill');
const questionsContainer = document.getElementById('questionsContainer');
const submitBtn = document.getElementById('submitBtn');

/* ═══════════════════════════════════════════════════════════
   START EXAM
   ═══════════════════════════════════════════════════════════ */
startBtn.addEventListener('click', () => {
  examineeName = nameInput.value.trim() || 'Examinee';
  quizName.textContent = examineeName;
  startScreen.classList.remove('active');
  quizScreen.classList.add('active');
  timerBox.style.display = 'flex';
  renderQuestions();
  updateTimerDisplay();
  updateProgress();
  startTimer();
});

nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') startBtn.click();
});

/* ═══════════════════════════════════════════════════════════
   RENDER QUESTIONS
   ═══════════════════════════════════════════════════════════ */
function renderQuestions() {
  const letters = ['a)', 'b)', 'c)', 'd)'];
  questionsContainer.innerHTML = questions.map((q, idx) => `
    <div class="question-card">
      <div class="question-number">Question ${idx + 1} of ${TOTAL}</div>
      <div class="question-text">${escapeHtml(q.text)}</div>
      <div class="options">
        ${q.options.map((opt, oi) => `
          <label class="option-label">
            <input type="radio" name="q${idx}" value="${oi}"
              ${answers[idx] === oi ? 'checked' : ''}
              data-qidx="${idx}" data-oidx="${oi}">
            <span class="option-prefix">${letters[oi]}</span>
            ${escapeHtml(opt)}
          </label>
        `).join('')}
      </div>
    </div>
  `).join('');

  questionsContainer.querySelectorAll('input[type="radio"]').forEach(radio => {
    radio.addEventListener('change', function () {
      if (isSubmitted) { this.checked = false; return; }
      answers[+this.dataset.qidx] = +this.dataset.oidx;
      updateProgress();
    });
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
  ));
}

function updateProgress() {
  const answered = answers.filter(a => a !== null).length;
  progressFill.style.width = (answered / TOTAL) * 100 + '%';
  answeredCount.textContent = `Answered: ${answered}`;
  const next = answers.findIndex(a => a === null);
  progressText.textContent = `Question ${(next === -1 ? TOTAL : next + 1)} of ${TOTAL}`;
}

/* ═══════════════════════════════════════════════════════════
   TIMER
   ═══════════════════════════════════════════════════════════ */
function startTimer() {
  stopTimer();
  timerInterval = setInterval(() => {
    timer--;
    if (timer < 0) timer = 0;
    updateTimerDisplay();
    if (timer <= 0) {
      stopTimer();
      submitExam(true);
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(timer / 60);
  const s = timer % 60;
  timerDisplay.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  timerBox.classList.toggle('warning', timer <= 60);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

/* ═══════════════════════════════════════════════════════════
   SUBMIT
   ═══════════════════════════════════════════════════════════ */
submitBtn.addEventListener('click', () => {
  if (isSubmitted) return;
  const answered = answers.filter(a => a !== null).length;
  const msg = answered < TOTAL
    ? `You have answered ${answered} out of ${TOTAL}. Submit anyway?`
    : 'Submit your exam?';
  if (!confirm(msg)) return;
  submitExam(false);
});

function submitExam(auto) {
  if (isSubmitted) return;
  isSubmitted = true;
  stopTimer();

  submitBtn.disabled = true;
  submitBtn.textContent = '⏳ Submitting…';
  questionsContainer.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);

  let correct = 0, wrong = 0, skipped = 0;
  const details = [];

  questions.forEach((q, idx) => {
    const ua = answers[idx];
    let status;
    if (ua === null) { skipped++; status = 'skipped'; }
    else if (ua === q.correct) { correct++; status = 'correct'; }
    else { wrong++; status = 'wrong'; }
    details.push({ idx, userAns: ua, correct: q.correct, status });
  });

  const rawScore = correct - wrong * NEGATIVE_MARK;
  const finalScore = Math.max(0, rawScore);
  const accuracy = +((correct / TOTAL) * 100).toFixed(1);

  showResults({
    correct, wrong, skipped,
    score: +finalScore.toFixed(2),
    accuracy,
    details,
    auto
  });
}

/* ═══════════════════════════════════════════════════════════
   RESULT SCREEN
   ═══════════════════════════════════════════════════════════ */
function showResults(r) {
  quizScreen.classList.remove('active');
  resultScreen.classList.add('active');
  timerBox.style.display = 'none';

  const letters = ['a)', 'b)', 'c)', 'd)'];

  const reviewHtml = r.details.map(d => {
    const q = questions[d.idx];
    const userText = d.userAns !== null
      ? letters[d.userAns] + ' ' + escapeHtml(q.options[d.userAns])
      : '— (skipped)';
    const correctText = letters[d.correct] + ' ' + escapeHtml(q.options[d.correct]);
    const statusLabel =
      d.status === 'correct' ? '<span class="status correct">Correct</span>' :
      d.status === 'wrong'   ? '<span class="status wrong">Wrong</span>' :
                               '<span class="status skipped">Skipped</span>';

    return `
      <div class="review-item">
        <span class="qnum">Q${d.idx + 1}</span>
        ${statusLabel}
        <span class="answer-detail">
          ${d.status === 'correct' ? '✅' : '❌'}
          Your answer: <span class="user-ans">${userText}</span>
          &nbsp;·&nbsp; Correct answer: <strong>${correctText}</strong>
        </span>
        <div class="explanation"><strong>Explanation:</strong> ${q.explanation}</div>
      </div>`;
  }).join('');

  resultScreen.innerHTML = `
    <div class="card">
      <h2>📊 ${escapeHtml(examineeName)} — Result</h2>
      <p class="hint">
        Marking: +1 correct · −${NEGATIVE_MARK} wrong · skipped = 0 · final score floored at 0
        ${r.auto ? '<br><strong style="color:#b22234">⏰ Time expired — auto-submitted.</strong>' : ''}
      </p>

      <div class="result-grid">
        <div class="result-stat highlight"><div class="number">${r.correct}</div><div class="label">✅ Correct</div></div>
        <div class="result-stat wrong"><div class="number">${r.wrong}</div><div class="label">❌ Wrong (−${NEGATIVE_MARK})</div></div>
        <div class="result-stat neutral"><div class="number">${r.skipped}</div><div class="label">⏭ Skipped</div></div>
        <div class="result-stat highlight" style="background:#e2edfb">
          <div class="number">${r.score} / ${TOTAL}</div><div class="label">⭐ Final Score</div>
        </div>
        <div class="result-stat" style="grid-column:span 2;background:#eef4fc">
          <div class="number">${r.accuracy}%</div><div class="label">Accuracy</div>
        </div>
      </div>

      <div style="display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:1.2rem">
        <button class="btn btn-secondary" onclick="location.reload()">🔄 Restart Quiz</button>
        <button class="btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">⬆ Back to Top</button>
      </div>

      <h3 style="font-size:1.1rem;color:#0b1e33;margin-bottom:.6rem;">📋 Answer Review &amp; Explanations</h3>
      ${reviewHtml}
    </div>
  `;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
